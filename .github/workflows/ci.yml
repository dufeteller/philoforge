name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/validate.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check website/dist/assets/spinoza.js
      - run: node --check website/dist/assets/proof-map.js
      - run: node --check website/dist/assets/theories.js
      - run: node --check website/dist/assets/workshop.js
      - run: node website/tests/theories.cjs
      - run: node scripts/check-proof-registry.cjs
      - run: node scripts/check-ai-justice.cjs
      - run: node --check website/archive/ai-justice/assets/ai-justice.js
      - run: node website/tests/ai-justice.cjs
      - run: node scripts/check-ethics-coverage.cjs
      - run: node scripts/check-spinoza-review.cjs
      - run: node --check website/dist/assets/review.js
      - run: node website/tests/review.cjs
      - run: node website/tests/spinoza.cjs
      - run: node website/tests/i18n.cjs
      - run: node --check website/dist/assets/ethics.js
      - run: node website/tests/ethics.cjs
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: logic
      - run: |
          if rg '\bsorry\b|\badmit\b|^axiom ' logic/PhiloForge; then exit 1; fi
